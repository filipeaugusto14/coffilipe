<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffilipe — Links</title>
  <style>
    :root{
      --cafe:#5b3a29; --cafe-esc:#3d2519; --creme:#f6efe7; --creme2:#efe4d6;
      --texto:#2a211c; --mudo:#c9b6a3; --branco:#fffdfb; --verde:#2e7d5b;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
      background:radial-gradient(120% 80% at 50% 0%, #6b452f 0%, #4d301f 55%, #331f13 100%);
      display:flex;flex-direction:column;align-items:center;padding:34px 16px 40px;
    }
    .avatar{width:104px;height:104px;border-radius:50%;box-shadow:0 6px 22px rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.18)}
    h1{margin:12px 0 2px;font-size:24px;font-family:Georgia,"Times New Roman",serif}
    .tag{margin:0;color:#e8d8c8;font-size:14px}

    /* Duas colunas: links à esquerda, produtos à direita */
    .colunas{width:100%;max-width:940px;margin-top:28px;display:flex;gap:22px;align-items:flex-start}
    .col-links{flex:0 0 380px;display:flex;flex-direction:column;gap:12px}
    .col-produtos{flex:1;min-width:0}
    @media (max-width:820px){
      .colunas{flex-direction:column;max-width:460px}
      .col-links{flex:none;width:100%}
    }

    .link{
      display:flex;align-items:center;gap:14px;background:var(--branco);color:var(--texto);
      text-decoration:none;border-radius:14px;padding:15px 16px;font-size:16px;font-weight:600;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
    }
    .link:active{transform:scale(.99)}
    .link .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
    .link .ic svg{width:22px;height:22px;display:block}
    .link .seta{margin-left:auto;color:var(--mudo);font-size:18px}
    .ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
    .tt{background:#000}
    .yt{background:#ff0000}
    .pa{background:var(--cafe)}
    .pe{background:#2e7d5b}
    .destaque{outline:2px solid rgba(255,255,255,.25)}

    /* Coluna de produtos */
    .prod-topo{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
    .prod-topo h2{font-size:17px;margin:0}
    .prod-topo a{color:#ffd9a8;font-size:13px;text-decoration:none}
    .prod-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:820px){ .prod-grade{grid-template-columns:1fr 1fr} }
    @media (max-width:440px){ .prod-grade{grid-template-columns:1fr} }
    .card{background:var(--branco);color:var(--texto);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.18)}
    .card .foto{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;padding:8px}
    .card .corpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
    .card .tit{font-size:13.5px;font-weight:600;line-height:1.25}
    .card .preco{color:var(--verde);font-weight:700;font-size:14px}
    .card .comprar{margin-top:auto;text-align:center;background:var(--cafe);color:#fff;text-decoration:none;padding:9px;border-radius:9px;font-weight:600;font-size:13px}
    .prod-vazio{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25);border-radius:14px;padding:24px 16px;text-align:center;color:#e8d8c8;font-size:14px}
    .prod-aviso{color:var(--mudo);font-size:11px;text-align:center;margin-top:12px}

    footer{margin-top:30px;color:#c9b6a3;font-size:12px;text-align:center}
  </style>
</head>
<body>

  <!-- Avatar (copo pra viagem + vapor nas cores do semáforo) -->
  <svg class="avatar" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Coffilipe">
    <rect width="1080" height="1080" fill="#3d2519"/>
    <circle cx="524" cy="318" r="26" fill="#e2483a"/>
    <circle cx="566" cy="256" r="24" fill="#f2b134"/>
    <circle cx="602" cy="198" r="22" fill="#3ba86b"/>
    <path d="M441 452 L639 452 L612 742 Q610 764 588 764 L492 764 Q470 764 468 742 Z" fill="#fbf4ea"/>
    <path d="M455 556 L625 556 L616 636 L464 636 Z" fill="#5b3a29"/>
    <path d="M427 452 L653 452 L653 430 Q653 414 637 414 L443 414 Q427 414 427 430 Z" fill="#efe0cb"/>
  </svg>

  <h1>Coffilipe</h1>
  <p class="tag">Um bom dia, escrito à mão ☕✍️</p>

  <div class="colunas">
    <!-- COLUNA ESQUERDA: LINKS -->
    <div class="col-links">
      <a class="link" href="https://instagram.com/coffilipe" target="_blank" rel="noopener">
        <span class="ic ig"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#fff" stroke="none"/></svg></span>
        Instagram <span class="seta">›</span>
      </a>
      <a class="link" href="https://tiktok.com/@coffilipe" target="_blank" rel="noopener">
        <span class="ic tt"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16.5 3c.3 2 1.6 3.6 3.5 3.9V9.4c-1.4 0-2.7-.4-3.8-1.1v6.1c0 3.1-2.5 5.6-5.6 5.6S5 17.5 5 14.4s2.5-5.6 5.6-5.6c.3 0 .6 0 .9.1v2.7c-.3-.1-.6-.2-.9-.2A3 3 0 1 0 13.6 14V3h2.9Z"/></svg></span>
        TikTok <span class="seta">›</span>
      </a>
      <a class="link" href="https://www.youtube.com/@Coffilipe" target="_blank" rel="noopener">
        <span class="ic yt"><svg viewBox="0 0 24 24" fill="#fff"><path d="M21.6 7.2s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16 4 12 4 12 4s-4 0-6.8.3c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2 8.8 2 10.5v1.4c0 1.7.2 3.3.2 3.3s.2 1.4.8 2c.8.8 1.8.8 2.3.9C6.9 20 12 20 12 20s4 0 6.8-.3c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.3v-1.4c0-1.7-.2-3.6-.2-3.6ZM10 14.5v-5l4.2 2.5-4.2 2.5Z"/></svg></span>
        YouTube <span class="seta">›</span>
      </a>
      <a class="link" href="parcerias/">
        <span class="ic pa" style="font-size:20px">🤝</span>
        Contato para parcerias <span class="seta">›</span>
      </a>
      <a class="link destaque" href="https://filipeaugusto14.github.io/pesquisa-coffilipe/" target="_blank" rel="noopener">
        <span class="ic pe" style="font-size:20px">📝</span>
        Responder a pesquisa (1 min) <span class="seta">›</span>
      </a>
    </div>

    <!-- COLUNA DIREITA: PRODUTOS -->
    <div class="col-produtos">
      <div class="prod-topo">
        <h2>🛒 Produtos que recomendo</h2>
        <a href="loja/">ver a loja →</a>
      </div>
      <div id="prod-grade" class="prod-grade"></div>
      <div id="prod-estado" class="prod-vazio">Carregando…</div>
      <p class="prod-aviso">Links de afiliado — posso ganhar uma comissão, sem custo pra você. 💛</p>
    </div>
  </div>

  <footer>☕ Coffilipe · café no sinal</footer>

  <script>
    var URL_BACKEND = 'https://script.google.com/macros/s/AKfycbz5eqDGRsC3L91xt9qBE0EA-fAVQbf6bvEBDElCxLmbcXlsJRtReUizc9oZ9AS92T2v8w/exec';
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function receberLoja(itens){
      var grade = document.getElementById('prod-grade');
      var estado = document.getElementById('prod-estado');
      itens = itens || [];
      if(!itens.length){ estado.textContent = 'Em breve, produtos recomendados aqui 🙂'; return; }
      estado.style.display = 'none';
      grade.innerHTML = itens.slice(0, 8).map(function(p){
        var foto = p.foto ? '<img class="foto" src="'+esc(p.foto)+'" alt="'+esc(p.titulo)+'" loading="lazy" onerror="this.style.display=\'none\'">' : '';
        var preco = p.preco ? '<div class="preco">'+esc(p.preco)+'</div>' : '';
        return '<div class="card">'+foto+'<div class="corpo"><div class="tit">'+esc(p.titulo)+'</div>'+preco+
          '<a class="comprar" href="'+esc(p.link)+'" target="_blank" rel="noopener nofollow sponsored">Comprar →</a></div></div>';
      }).join('');
    }

    (function(){
      var s = document.createElement('script');
      s.src = URL_BACKEND + '?loja=1&callback=receberLoja&t=' + Date.now();
      s.onerror = function(){ document.getElementById('prod-estado').textContent = 'Não consegui carregar os produtos.'; };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>

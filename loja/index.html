<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja Coffilipe — produtos que recomendo</title>
  <style>
    :root{
      --cafe:#5b3a29; --cafe-esc:#3d2519; --creme:#f6efe7; --creme2:#efe4d6;
      --texto:#2a211c; --mudo:#8a7d72; --borda:#e3d6c6; --branco:#fffdfb; --verde:#2e7d5b;
      --sombra:0 2px 8px rgba(60,40,20,.10);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
    body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:var(--texto)}
    .topo{background:radial-gradient(120% 120% at 30% 0%,#6b452f,#3d2519);color:#fff;text-align:center;padding:26px 16px 22px}
    .topo .logo{font-size:34px}
    .topo h1{margin:6px 0 2px;font-size:21px}
    .topo p{margin:4px auto 0;color:#e8d8c8;font-size:13px;max-width:520px;line-height:1.4}
    .voltar{display:inline-block;margin-top:12px;color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:20px}
    main{max-width:820px;margin:0 auto;padding:16px}
    .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .prod{background:var(--branco);border:1px solid var(--borda);border-radius:16px;overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column}
    .prod .foto{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;padding:10px}
    .prod .corpo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
    .prod .tit{font-size:15px;font-weight:600;line-height:1.3}
    .prod .preco{color:var(--verde);font-weight:700;font-size:16px}
    .prod .btn{margin-top:auto;display:block;text-align:center;background:var(--cafe);color:#fff;text-decoration:none;padding:11px;border-radius:10px;font-weight:600;font-size:14px}
    .prod .btn:active{transform:scale(.99)}
    .aviso{max-width:820px;margin:6px auto 0;padding:0 16px;color:var(--mudo);font-size:12px;text-align:center}
    .estado{text-align:center;color:var(--mudo);padding:50px 16px}
    .rodape{text-align:center;color:var(--mudo);font-size:12px;padding:24px 0 34px}
  </style>
</head>
<body>

  <header class="topo">
    <div class="logo">🛒☕</div>
    <h1>Produtos que eu recomendo</h1>
    <p>Coisas boas pra quem ama café e um bom dia. Escolhidas pelo Filipe.</p>
    <a class="voltar" href="../">← voltar aos links</a>
  </header>

  <p class="aviso">Alguns links são de afiliado — posso ganhar uma pequena comissão, sem custo extra pra você. 💛</p>

  <main>
    <div id="grade" class="grade"></div>
    <div id="estado" class="estado">Carregando os produtos…</div>
  </main>

  <p class="rodape">☕ Coffilipe — um bom dia, escrito à mão</p>

  <script>
    var URL_BACKEND = 'https://script.google.com/macros/s/AKfycbz5eqDGRsC3L91xt9qBE0EA-fAVQbf6bvEBDElCxLmbcXlsJRtReUizc9oZ9AS92T2v8w/exec';

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function corMarket(n){ n=(n||'').toLowerCase();
      if(n.indexOf('mercado')>=0) return ['#ffe600','#2a2a2a'];
      if(n.indexOf('amazon')>=0) return ['#232f3e','#fff'];
      if(n.indexOf('shopee')>=0) return ['#ee4d2d','#fff'];
      if(n.indexOf('ali')>=0) return ['#e62e04','#fff'];
      if(n.indexOf('magalu')>=0||n.indexOf('magazine')>=0) return ['#0086ff','#fff'];
      if(n.indexOf('americanas')>=0) return ['#e60014','#fff'];
      return ['#5b3a29','#fff']; }
    function badgeMarket(n){ if(!n) return ''; var c=corMarket(n);
      return '<span style="display:inline-block;align-self:flex-start;background:'+c[0]+';color:'+c[1]+';font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px">'+esc(n)+'</span>'; }

    function receberLoja(itens){
      var grade = document.getElementById('grade');
      var estado = document.getElementById('estado');
      itens = itens || [];
      if(!itens.length){ estado.textContent = 'Em breve, produtos recomendados aqui 🙂'; return; }
      estado.style.display = 'none';
      grade.innerHTML = itens.map(function(p){
        var foto = p.foto
          ? '<img class="foto" src="'+esc(p.foto)+'" alt="'+esc(p.titulo)+'" loading="lazy" onerror="this.style.display=\'none\'">'
          : '';
        var preco = p.preco ? '<div class="preco">'+esc(p.preco)+'</div>' : '';
        return '<div class="prod">'+foto+
          '<div class="corpo">'+badgeMarket(p.marketplace)+'<div class="tit">'+esc(p.titulo)+'</div>'+preco+
          '<a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener nofollow sponsored">Comprar →</a></div></div>';
      }).join('');
    }

    // Carrega os produtos via JSONP (funciona cross-origin e em navegador embutido).
    (function(){
      var s = document.createElement('script');
      s.src = URL_BACKEND + '?loja=1&callback=receberLoja&t=' + Date.now();
      s.onerror = function(){ document.getElementById('estado').textContent = 'Não consegui carregar os produtos. Tente recarregar.'; };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
